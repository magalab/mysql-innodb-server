name: Publish Docker image

on:
  push:
    tags:
      - '*'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    name: Build and publish multi-platform image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve and validate MySQL source version
        id: source
        shell: bash
        run: |
          set -euo pipefail

          read -r source_sha256 source_archive < SOURCE.sha256
          source_version="${source_archive#mysql-}"
          source_version="${source_version%.tar.gz}"
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ ! "$source_sha256" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::SOURCE.sha256 does not contain a valid SHA-256 checksum"
            exit 1
          fi

          if [[ "$tag_version" != "$source_version" ]]; then
            echo "::error::Git tag '$GITHUB_REF_NAME' does not match MySQL source version '$source_version'"
            echo "::error::Update SOURCE.sha256 and the patches before creating a new release tag."
            exit 1
          fi

          source_series="${source_version%.*}"
          source_url="https://cdn.mysql.com/Downloads/MySQL-${source_series}/mysql-${source_version}.tar.gz"

          echo "version=${source_version}" >> "$GITHUB_OUTPUT"
          echo "sha256=${source_sha256}" >> "$GITHUB_OUTPUT"
          echo "url=${source_url}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/magalab/mysql-innodb-server
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ github.ref_name }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            MYSQL_VERSION=${{ steps.source.outputs.version }}
            MYSQL_SOURCE_URL=${{ steps.source.outputs.url }}
            MYSQL_SOURCE_SHA256=${{ steps.source.outputs.sha256 }}
            CMAKE_BUILD_PARALLEL_LEVEL=2
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mysql-innodb-server
          cache-to: type=gha,mode=max,scope=mysql-innodb-server
