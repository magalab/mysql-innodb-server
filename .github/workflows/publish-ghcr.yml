name: Publish Docker image

on:
  push:
    tags:
      - '*'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    name: Build and publish (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve and validate MySQL source version
        id: source
        shell: bash
        run: |
          set -euo pipefail

          tag_version="${GITHUB_REF_NAME#v}"

          if [[ ! "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Git tag '$GITHUB_REF_NAME' must be a MySQL version, optionally prefixed with 'v'"
            exit 1
          fi

          target_dir="targets/mysql-${tag_version%.*}"
          source_file="${target_dir}/SOURCE.sha256"
          if [[ ! -f "$source_file" ]]; then
            echo "::error::No build target found for MySQL version '$tag_version' at '$target_dir'"
            exit 1
          fi

          read -r source_sha256 source_archive < "$source_file"
          source_version="${source_archive#mysql-}"
          source_version="${source_version%.tar.gz}"

          if [[ ! "$source_sha256" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::$source_file does not contain a valid SHA-256 checksum"
            exit 1
          fi

          if [[ "$tag_version" != "$source_version" ]]; then
            echo "::error::Git tag '$GITHUB_REF_NAME' does not match MySQL source version '$source_version'"
            echo "::error::Update the source pin and patches for '$target_dir' before creating a new release tag."
            exit 1
          fi

          source_series="${source_version%.*}"
          source_url="https://cdn.mysql.com/Downloads/MySQL-${source_series}/mysql-${source_version}.tar.gz"

          echo "version=${source_version}" >> "$GITHUB_OUTPUT"
          echo "sha256=${source_sha256}" >> "$GITHUB_OUTPUT"
          echo "url=${source_url}" >> "$GITHUB_OUTPUT"
          echo "target_name=mysql-${tag_version%.*}" >> "$GITHUB_OUTPUT"
          echo "target_dir=${target_dir}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/magalab/mysql-innodb-server
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ github.ref_name }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.source.outputs.target_dir }}
          file: ${{ steps.source.outputs.target_dir }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            MYSQL_VERSION=${{ steps.source.outputs.version }}
            MYSQL_SOURCE_URL=${{ steps.source.outputs.url }}
            MYSQL_SOURCE_SHA256=${{ steps.source.outputs.sha256 }}
            CMAKE_BUILD_PARALLEL_LEVEL=4
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mysql-innodb-server-${{ steps.source.outputs.target_name }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=mysql-innodb-server-${{ steps.source.outputs.target_name }}-${{ matrix.platform }}
